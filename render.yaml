# Render Blueprint: one web service runs the Express API and serves the built React app.
# Deploy: Render dashboard → New → Blueprint → pick this repo. Fill in MONGO_URI when asked.
services:
  - type: web
    name: dinesh-portfolio
    runtime: node
    plan: free
    # NODE_ENV=production makes npm skip devDependencies, but the client needs Vite to build.
    buildCommand: npm --prefix server install --omit=dev && npm --prefix client install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
