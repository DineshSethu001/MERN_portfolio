# Local MongoDB only:          docker compose up -d mongo
# Full app (API + built React): docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/portfolio
      CLIENT_ORIGIN: http://localhost:5000
    volumes:
      - uploads:/app/server/uploads

volumes:
  mongo-data:
  uploads:
